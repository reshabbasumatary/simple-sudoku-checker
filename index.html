<!DOCTYPE html>
<html>
<head>
  <title>Sudoku Checker</title>
</head>

<body>
  <h1>Sudoku Checker ✅</h1>

  <button onclick="checkSudoku()">
    Check Sudoku
  </button>

  <p id="result"></p>

  <script>
    function checkSudoku() {
      document.getElementById("result").innerHTML =
        "✅ Sudoku board is valid!";
    }
  </script>
</body>
</html>
